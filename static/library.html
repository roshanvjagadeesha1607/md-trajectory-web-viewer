<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MD Trajectory Library</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --line: #262d38; --ink: #e6edf3;
    --dim: #8b98a9; --accent: #4ea1ff; --accent2: #37c98b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  header {
    padding: 34px 24px 20px; border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, #131a24, var(--bg));
  }
  .wrap { max-width: 1180px; margin: 0 auto; }
  h1 { margin: 0 0 6px; font-size: 26px; letter-spacing: .2px; }
  .sub { color: var(--dim); font-size: 14px; }
  main { padding: 22px 24px 60px; }
  .bar {
    display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
    margin-bottom: 18px;
  }
  #q {
    flex: 1 1 260px; max-width: 420px; padding: 10px 13px; font-size: 15px;
    color: var(--ink); background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; outline: none;
  }
  #q:focus { border-color: var(--accent); }
  #count { color: var(--dim); font-size: 13px; }
  #grid {
    display: grid; gap: 16px;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 11px; padding: 16px 17px; display: flex;
    flex-direction: column; gap: 12px;
  }
  .card h2 { margin: 0; font-size: 17px; line-height: 1.3; }
  .desc { color: var(--dim); font-size: 13.5px; margin: 0; }
  .stats {
    display: grid; grid-template-columns: 1fr 1fr; gap: 7px 14px;
    font-size: 13px;
  }
  .stats b { font-weight: 600; color: var(--ink); }
  .stats span { color: var(--dim); }
  .files { font-size: 11.5px; color: #6d7a8b; font-family: ui-monospace, Menlo, Consolas, monospace; }
  .files em { font-style: normal; color: #7f8c9e; }
  .open {
    align-self: flex-start; text-decoration: none; font-size: 14px;
    font-weight: 600; color: #06111f; background: var(--accent);
    border-radius: 8px; padding: 9px 16px;
  }
  .open:hover { background: #6fb4ff; }
  .empty { color: var(--dim); padding: 40px 4px; }
  .empty code { background: var(--panel); border: 1px solid var(--line);
    border-radius: 5px; padding: 1px 6px; font-size: 12.5px;
    font-family: ui-monospace, Menlo, Consolas, monospace; color: #b9c6d6; }
  .sect { margin: 30px 0 14px; font-size: 18px; font-weight: 600;
          color: var(--ink); border-bottom: 1px solid var(--line);
          padding-bottom: 8px; }
  main > .sect:first-child { margin-top: 4px; }
  .foldgrid {
    display: grid; gap: 16px;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  }
  .fcard {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 11px; padding: 16px 17px; display: flex;
    flex-direction: column; gap: 12px;
  }
  .fcard h3 { margin: 0; font-size: 16px; line-height: 1.3; }
  .fcard .sub { color: var(--dim); font-size: 13px; }
  .browse {
    align-self: flex-start; text-decoration: none; font-size: 14px;
    font-weight: 600; color: #04140d; background: var(--accent2);
    border-radius: 8px; padding: 9px 16px;
  }
  .browse:hover { background: #56daa0; }
  .tag {
    display: inline-block; font-size: 11px; color: var(--accent2);
    border: 1px solid #234b3c; border-radius: 999px; padding: 1px 8px;
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>MD Trajectory Library</h1>
    <div class="sub">Registered molecular dynamics simulations &mdash; open any one for
      interactive playback in the browser.</div>
  </div>
</header>

<main class="wrap">
  <h2 class="sect">Saved Simulations</h2>
  <div class="bar">
    <input id="q" type="search" placeholder="Search name, description, file&hellip;"
           autocomplete="off" aria-label="Search projects">
    <span id="count"></span>
  </div>
  <div id="grid"></div>
  <div id="empty" class="empty" hidden>No simulations match your search.</div>

  <h2 class="sect" id="foldersHead" hidden>Browse Simulation Folders</h2>
  <div class="foldgrid" id="foldgrid"></div>
  <div id="foldersEmpty" class="empty" hidden></div>
</main>

<script>
const grid = document.getElementById('grid');
const count = document.getElementById('count');
const empty = document.getElementById('empty');
const q = document.getElementById('q');
let ALL = [];

const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const num = n => (n == null ? '—' : Number(n).toLocaleString('en-US'));
const dur = p => {
  if (p.frames == null) return '—';
  if (p.duration_ns != null) return p.duration_ns.toLocaleString('en-US',
      {maximumFractionDigits: 2}) + ' ns';
  return '—';
};
const span = p => (p.first_time_ns == null || p.last_time_ns == null) ? '—'
    : p.first_time_ns + ' – ' + p.last_time_ns + ' ns';
const interval = p => p.frame_interval_ps == null ? '—'
    : (p.frame_interval_ps % 1 === 0 ? p.frame_interval_ps
                                     : p.frame_interval_ps.toFixed(2)) + ' ps';

// Component chips: non-polymer residue names auto-discovered from the GRO.
// Ligands and ions always show; water collapses to one chip when present.
function compChips(p) {
  const comps = (p.components || []).filter(c =>
      c.category !== 'protein' && c.category !== 'nucleic');
  if (!comps.length) return '';
  const water = comps.filter(c => c.category === 'water');
  const rest = comps.filter(c => c.category !== 'water');
  const safeColor = c => /^#[0-9a-fA-F]{6}$/.test(c || '') ? c : '';
  let chips = rest.map(c => {
      const col = safeColor(c.color);
      return `<span class="tag"${col ? ` style="border-color:${col}"` : ''}>` +
             `${esc(c.resname)}</span>`;
    });
  if (water.length) chips.push('<span class="tag">water</span>');
  return chips.join(' ');
}

function card(p) {
  const lig = compChips(p);
  return `<div class="card">
    <div>
      <h2>${esc(p.name)}</h2>
      ${p.description ? `<p class="desc">${esc(p.description)}</p>` : ''}
    </div>
    <div class="stats">
      <div><span>Atoms</span><br><b>${num(p.atoms)}</b></div>
      <div><span>Frames</span><br><b>${num(p.frames)}</b></div>
      <div><span>Duration</span><br><b>${dur(p)}</b></div>
      <div><span>Range</span><br><b>${span(p)}</b></div>
      <div><span>Frame interval</span><br><b>${interval(p)}</b></div>
      <div><span>Size</span><br><b>${esc(p.xtc_size || '—')}</b></div>
    </div>
    ${lig ? `<div>${lig}</div>` : ''}
    <div class="files"><em>GRO</em> ${esc(p.gro_filename)} &nbsp;&middot;&nbsp;
      <em>XTC</em> ${esc(p.xtc_filename)}</div>
    <a class="open" href="view/${encodeURIComponent(p.id)}/">Open Simulation</a>
  </div>`;
}

function render() {
  const t = q.value.trim().toLowerCase();
  const hits = !t ? ALL : ALL.filter(p =>
      [p.name, p.description, p.id, p.gro_filename, p.xtc_filename,
       // auto-detected residue names, so 'GTP' or 'SOL' finds a project
       (p.components || []).map(c => c.resname).join(' ')].join(' ')
       .toLowerCase().includes(t));
  grid.innerHTML = hits.map(card).join('');
  count.textContent = hits.length === ALL.length
      ? `${ALL.length} simulation${ALL.length === 1 ? '' : 's'}`
      : `${hits.length} of ${ALL.length}`;
  empty.hidden = hits.length > 0;
}

q.addEventListener('input', render);

// ---- Saved Simulations --------------------------------------------------
fetch('api/projects', {cache: 'no-store'})
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => {
    ALL = d.projects || [];
    render();
    if (!ALL.length) {
      // First run: nothing registered yet. Tell the user how to add some
      // instead of showing a bare "no matches" line.
      empty.hidden = false;
      empty.innerHTML =
        'No simulations registered yet.<br><br>' +
        'Add one with <code>./add_project.sh</code>, or register a whole ' +
        'folder below with <code>./add_folder.sh</code>.';
    }
  })
  .catch(e => {
    count.textContent = '';
    grid.innerHTML = '';
    empty.hidden = false;
    empty.textContent = 'Could not load the project list (' + e + '). ' +
                        'Is the server running?';
  });

// ---- Browse Simulation Folders -----------------------------------------
// Folders are read-only allowed roots; a visitor only ever sees the display
// name and a Browse button — never the server-side path.
function folderCard(f) {
  return `<div class="fcard">
    <div>
      <h3>&#128193; ${esc(f.name)}</h3>
      <div class="sub">Browse this folder in the browser &mdash; pick a .gro
        and a .xtc to open.</div>
    </div>
    <a class="browse" href="browse/${encodeURIComponent(f.id)}/">Browse Folder</a>
  </div>`;
}

fetch('api/folders', {cache: 'no-store'})
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => {
    const folders = d.folders || [];
    const head = document.getElementById('foldersHead');
    const fgrid = document.getElementById('foldgrid');
    const fempty = document.getElementById('foldersEmpty');
    head.hidden = false;
    if (!folders.length) {
      fgrid.innerHTML = '';
      fempty.hidden = false;
      fempty.innerHTML = 'No folders registered yet. Register one with ' +
        '<code>./add_folder.sh "Display Name" /absolute/path</code>.';
      return;
    }
    fempty.hidden = true;
    fgrid.innerHTML = folders.map(folderCard).join('');
  })
  .catch(() => { /* folder section simply stays hidden if the call fails */ });
</script>
</body>
</html>
